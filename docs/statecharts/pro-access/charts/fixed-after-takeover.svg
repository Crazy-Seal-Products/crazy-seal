}</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="290" y="25.6">Who can get into a Pro Hub account</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="288.64" y="8" width="282.74" height="112" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M288.64,44H571.38" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="430.01" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M241.64,120L241.64,157"/><path class="pele-marker" d="M241.64,164L238.28,156L245,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M180.71,247C180.71,256.25 116.49,256.25 116.49,265.5L116.49,342"/><path class="pele-marker" d="M116.49,349L113.13,341L119.85,341Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M302.58,247C302.58,256.25 366.8,256.25 366.8,265.5L366.8,342"/><path class="pele-marker" d="M366.8,349L363.44,341L370.16,341Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="19.51" y="267.5" width="193.96" height="54" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="116.49" y="281.4">the pro sets a password from</tspan><tspan x="116.49" y="299.4">the link, which signs everyone</tspan><tspan x="116.49" y="317.4">else out</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="291.21" y="284" width="151.18" height="21" rx="3" fill="var(--_bg)"/><text x="366.8" y="299.4" text-anchor="middle">the link signs the pro in</text></g></g><g class="pele-nodes"><g class="pele-node pele-state pink" data-id="s0" transform="translate(241.64,205.5)"><rect x="-112.94" y="-41.5" width="225.87" height="83" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">A stranger set the</tspan><tspan x="0" y="5.6">password, and the stranger</tspan><tspan x="0" y="26.6">is signed in</tspan></text></g><g class="pele-node pele-state teal" data-id="s1" transform="translate(116.49,380)"><rect x="-108.49" y="-31" width="216.98" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">The pro set the password,</tspan><tspan x="0" y="16.1">and the pro is signed in</tspan></text></g><g class="pele-node pele-state pink" data-id="s2" transform="translate(366.8,401)"><rect x="-101.82" y="-52" width="203.65" height="104" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">A stranger set the</tspan><tspan x="0" y="-4.9">password, and both the</tspan><tspan x="0" y="16.1">stranger and the pro are</tspan><tspan x="0" y="37.1">signed in</tspan></text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(241.64,113)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state teal" data-id="lg0" transform="translate(354,82)"><rect x="-49.35" y="-22" width="98.7" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Signed in</text></g><g class="pele-node pele-state pink" data-id="lg1" transform="translate(499.36,82)"><rect x="-56.02" y="-22" width="112.03" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Taken over</text></g></g></g></svg>