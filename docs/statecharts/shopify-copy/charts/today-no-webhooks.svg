}</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="598.5" y="25.6">Crazy Seal's copy of Shopify orders</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="401.13" y="8" width="787.84" height="130" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M401.13,44H1188.97" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="795.05" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M354.13,138L354.13,175"/><path class="pele-marker" d="M354.13,182L350.77,174L357.49,174Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M354.13,226L354.13,288"/><path class="pele-marker" d="M354.13,295L350.77,287L357.49,287Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M466.18,318C492.18,310 492.18,342 472.87,336.06"/><path class="pele-marker" d="M466.18,334L474.81,333.14L472.84,339.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M354.13,357L354.13,434"/><path class="pele-marker" d="M354.13,441L350.77,433L357.49,433Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="262.98" y="246.5" width="182.31" height="21" rx="3" fill="var(--_bg)"/><text x="354.13" y="261.9" text-anchor="middle">an order changes in Shopify</text></g><g class="pele-edge-label" data-id="edge2"><rect x="498.18" y="308" width="204.08" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="600.22" y="321.9">a minute passes or a new order</tspan><tspan x="600.22" y="339.9">comes in</tspan></text></g><g class="pele-edge-label" da